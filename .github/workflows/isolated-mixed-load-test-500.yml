name: CompassU Isolated 500-User Mixed Workload Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixed-500:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated load-test assets only
        uses: actions/checkout@v4
        with:
          ref: load-test-pilot-10k
      - name: Verify isolated target
        run: |
          test -f load-tests/mixed-500.js
          grep -q "itmxtmasbslmciaopnow" load-tests/mixed-500.js
      - name: Install k6
        run: |
          sudo gpg -k
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      - name: Run 500-user mixed workload
        env:
          SUPABASE_URL: https://itmxtmasbslmciaopnow.supabase.co
          SUPABASE_KEY: ${{ secrets.LOAD_TEST_SUPABASE_PUBLISHABLE_KEY }}
          LOAD_TEST_PASSWORD: ${{ secrets.LOAD_TEST_USER_PASSWORD }}
        run: k6 run --summary-export=load-tests/mixed-500-summary.json load-tests/mixed-500.js
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-500-summary
          path: load-tests/mixed-500-summary.json
          if-no-files-found: warn
