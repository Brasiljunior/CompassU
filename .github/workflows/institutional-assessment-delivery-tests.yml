name: Institutional Assessment Delivery Tests

on:
  push:
    branches:
      - feature/institutional-assessment-delivery
    paths:
      - 'lib/institutional*.mjs'
      - 'app/api/institutional-reports/**'
      - 'app/institutional-reports/**'
      - 'supabase/institutional*.sql'
      - 'tests/institutional*.test.mjs'
      - 'package.json'
      - '.github/workflows/institutional-assessment-delivery-tests.yml'
  pull_request:
    paths:
      - 'lib/institutional*.mjs'
      - 'app/api/institutional-reports/**'
      - 'app/institutional-reports/**'
      - 'supabase/institutional*.sql'
      - 'tests/institutional*.test.mjs'
      - 'package.json'
      - '.github/workflows/institutional-assessment-delivery-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run institutional delivery policy tests
        run: npm run test:institutional-delivery
      - name: Validate Next.js production build
        run: npm run build
