name: Institutional Assessment Delivery Tests

on:
  push:
    branches:
      - feature/institutional-assessment-delivery
    paths:
      - 'lib/institutional*.mjs'
      - 'app/api/institutional-reports/**'
      - 'app/api/institutional-reconciliation/**'
      - 'app/institutional-reports/**'
      - 'supabase/institutional*.sql'
      - 'tests/institutional*.test.mjs'
      - 'package.json'
      - '.github/workflows/institutional-assessment-delivery-tests.yml'
  pull_request:
    paths:
      - 'lib/institutional*.mjs'
      - 'app/api/institutional-reports/**'
      - 'app/api/institutional-reconciliation/**'
      - 'app/institutional-reports/**'
      - 'supabase/institutional*.sql'
      - 'tests/institutional*.test.mjs'
      - 'package.json'
      - '.github/workflows/institutional-assessment-delivery-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify institutional test source parses
        run: |
          for test_file in tests/institutional*.test.mjs; do
            node --check "$test_file"
          done
      - name: Run institutional delivery policy tests
        id: institutional
        continue-on-error: true
        run: npm run test:institutional-delivery
      - name: Run existing pilot regression tests
        id: pilot
        continue-on-error: true
        run: npm run test:pilot
      - name: Validate Next.js production build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Enforce Phase 1 acceptance gates
        if: always()
        env:
          INSTITUTIONAL: ${{ steps.institutional.outcome }}
          PILOT: ${{ steps.pilot.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "Institutional tests: $INSTITUTIONAL"
          echo "Pilot regressions: $PILOT"
          echo "Next.js build: $BUILD"
          if [ "$INSTITUTIONAL" != success ] || [ "$PILOT" != success ] || [ "$BUILD" != success ]; then
            echo 'Phase 1 failed: all three gates must pass.'
            exit 1
          fi
