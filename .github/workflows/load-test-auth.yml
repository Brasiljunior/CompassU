name: CompassU Isolated Auth Load Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated load-test branch
        uses: actions/checkout@v4

      - name: Verify branch safety boundary
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "load-test-pilot-10k" || { echo "Refusing to run outside isolated load-test branch"; exit 1; }

      - name: Install k6
        shell: bash
        run: |
          sudo gpg -k
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run 50-user isolated authentication baseline
        env:
          SUPABASE_URL: https://itmxtmasbslmciaopnow.supabase.co
          SUPABASE_KEY: ${{ secrets.LOAD_TEST_SUPABASE_PUBLISHABLE_KEY }}
          LOAD_TEST_PASSWORD: ${{ secrets.LOAD_TEST_USER_PASSWORD }}
        run: k6 run --summary-export=load-tests/auth-baseline-summary.json load-tests/auth-baseline.js

      - name: Upload load-test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-baseline-summary
          path: load-tests/auth-baseline-summary.json
          if-no-files-found: warn
