name: CompassU Layer 2 Integration Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated load-test branch
        uses: actions/checkout@v4

      - name: Verify isolation boundary
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "load-test-pilot-10k" || { echo "Refusing to run outside isolated load-test branch"; exit 1; }

      - name: Install k6
        shell: bash
        run: |
          sudo gpg -k
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Validate classroom authentication queue
        env: &load_env
          SUPABASE_URL: https://itmxtmasbslmciaopnow.supabase.co
          SUPABASE_KEY: ${{ secrets.LOAD_TEST_SUPABASE_PUBLISHABLE_KEY }}
          LOAD_TEST_PASSWORD: ${{ secrets.LOAD_TEST_USER_PASSWORD }}
        run: k6 run --summary-export=load-tests/layer2-auth-summary.json load-tests/auth-classroom-queue.js

      - name: Validate assessment persistence scoring and recommendations
        env: *load_env
        run: k6 run --summary-export=load-tests/layer2-assessment-summary.json load-tests/finalize-50.js

      - name: Validate authenticated read and admin-style operational load
        env: *load_env
        run: k6 run --summary-export=load-tests/layer2-admin-summary.json load-tests/admin-5k.js

      - name: Upload Layer 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer2-integration-evidence
          path: |
            load-tests/layer2-auth-summary.json
            load-tests/layer2-assessment-summary.json
            load-tests/layer2-admin-summary.json
          if-no-files-found: warn
