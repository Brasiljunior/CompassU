name: CompassU Deterministic Lockfile Validation

on:
  workflow_dispatch:
  push:
    branches: [remediation-deterministic-build]
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test_publishable_key
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile exists
        run: test -s package-lock.json
      - name: Clean install from lockfile
        run: npm ci
      - name: Dependency audit details
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('npm-audit.json','utf8'));
          console.log('VULNERABILITY_SUMMARY', JSON.stringify(a.metadata?.vulnerabilities||{}));
          for (const [name,v] of Object.entries(a.vulnerabilities||{})) {
            console.log('VULNERABILITY', JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,via:v.via,effects:v.effects,range:v.range,nodes:v.nodes,fixAvailable:v.fixAvailable}));
          }
          NODE
      - name: Build CompassU
        run: npm run build
      - name: Upload generated lockfile and audit
        uses: actions/upload-artifact@v4
        with:
          name: compassu-deterministic-build
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error
