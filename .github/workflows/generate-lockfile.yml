name: CompassU Deterministic Lockfile Validation

on:
  workflow_dispatch:
  push:
    branches: [remediation-deterministic-build]
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test_publishable_key
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile exists
        run: test -s package-lock.json
      - name: Clean install from lockfile
        run: npm ci
      - name: Require clean dependency audit
        run: npm audit --audit-level=low
      - name: Build CompassU
        run: npm run build
      - name: Commit validated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Add validated deterministic dependency lockfile"
          git push origin HEAD:remediation-deterministic-build
